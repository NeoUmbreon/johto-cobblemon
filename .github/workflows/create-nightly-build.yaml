name: Nightly build
description: Runs on push to main

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'

permissions:
  contents: write

env:
  NIGHTLY_TAG: "nightly"
  NIGHTLY_NAME: "nightly"
  NIGHTLY_BODY: |-
    This is an automatic nightly release. It may have changes that are not fully tested.

    If you are updating from a stable release: **BACK UP YOUR WORLD!**

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - uses: ./.github/actions/package

      - name: Update nightly tag
        run: |
          git tag $NIGHTLY_TAG -f
          git push origin $NIGHTLY_TAG -f

      - name: Generate release notes
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 --match '[0-9]+.[0-9]+.[0-9]+' HEAD 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            {
              echo "$NIGHTLY_BODY"
              echo
              echo "## Changes since $LAST_TAG"
              echo
              git log --no-merges --pretty='- %s (%h)' "$LAST_TAG..HEAD" -- . ':(exclude)CHANGELOG.md'
              echo
              echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$LAST_TAG...$NIGHTLY_TAG"
            } > notes.md
          else
            echo "$NIGHTLY_BODY" > notes.md
          fi
          cat notes.md

      - name: Create or update release
        run: |
          if gh release view $NIGHTLY_TAG >/dev/null 2>&1; then
            gh release edit $NIGHTLY_TAG --title "$NIGHTLY_NAME" --notes-file notes.md --prerelease
          else
            gh release create $NIGHTLY_TAG --title "$NIGHTLY_NAME" --notes-file notes.md --prerelease
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release assets
        run: |
          gh release upload $NIGHTLY_TAG johto-cobblemon.zip CobblemonJohtoResourcePack.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
